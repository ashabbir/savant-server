[pytest]
markers =
    no_db: unit test that does not require the shared database fixture
testpaths = tests_refactored tests
addopts = -q --cov=hardening --cov=db.base --cov=models --cov=abilities.resolver --cov=abilities.bootstrap --cov=server_paths --cov=abilities.skills_routes --cov-report=term-missing --cov-fail-under=90
